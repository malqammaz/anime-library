<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبتي · الأنمي</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="shell">
<header><a class="brand" href="#"><span class="brand-icon" aria-hidden="true">▤</span><span>مكتبتي<small>ANIME LIBRARY</small></span></a></header>
